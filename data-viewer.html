<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALACRITY | Admin Dashboard</title>
  <style>
    :root {
      --bg-black: #000000;
      --card-bg: #111111;
      --text-white: #FFFFFF;
      --accent-orange: #E58E58; 
      --accent-coral: #D67062; 
      --muted-gray: #777777;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      margin: 0;
      padding: 40px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-section {
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      margin: 0;
      letter-spacing: -1px;
    }

    .highlight { color: var(--accent-orange); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 20px;
      border: 1px solid #222;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted-gray);
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: var(--card-bg);
    }

    th {
      text-align: left;
      padding: 15px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted-gray);
      border-bottom: 2px solid #222;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #222;
      font-size: 0.9rem;
    }

    tr:hover { background: #1a1a1a; }

    a { color: var(--accent-coral); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Controls & Forms */
    .admin-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 20px;
      border: 1px solid white;
      background: transparent;
      color: white;
      text-transform: uppercase;
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover { background: white; color: black; }
    .btn-danger { border-color: var(--accent-red); color: var(--accent-red); }
    .btn-danger:hover { background: var(--accent-red); color: white; }

    .input-field {
      background: transparent;
      border: 1px solid #333;
      color: white;
      padding: 10px;
      font-family: inherit;
    }

    .access-management {
      margin-top: 60px;
      padding: 30px;
      border: 1px solid #222;
      background: #080808;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-section">
      <h1>SURVEILLANCE <span class="highlight">OVERSIGHT</span></h1>
      <div class="stat-label">System Version 1.0</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Active Admin ID</div>
        <div class="stat-value" id="userId">Loading...</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Surveillance Records</div>
        <div class="stat-value" id="totalRecords">0</div>
      </div>
    </div>

    <div class="admin-controls">
      <button class="btn" onclick="exportAllAsJSON()">Download JSON</button>
      <button class="btn" onclick="exportAllAsCSV()">Download CSV</button>
      <button class="btn btn-danger" onclick="clearAllData()">Wipe All Logs</button>
    </div>

    <table id="dataTable">
      <thead>
        <tr>
          <th>Employee Identity</th>
          <th>Accessed URL</th>
          <th>Full Timestamp</th>
          <th>Date</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="5" style="text-align: center; color: var(--muted-gray);">Awaiting data capture...</td></tr>
      </tbody>
    </table>

    <div class="access-management">
      <h3 style="margin-top: 0; letter-spacing: 1px;">MANAGE EMPLOYEE CREDENTIALS</h3>
      <p style="font-size: 0.8rem; color: var(--muted-gray); margin-bottom: 20px;">Register new Employee IDs and Access Codes for the verification gate.</p>
      <div style="display: flex; gap: 10px;">
        <input type="text" id="newEmpID" placeholder="EMPLOYEE ID" class="input-field">
        <input type="text" id="newEmpCode" placeholder="ACCESS CODE" class="input-field">
        <button class="btn" id="saveUserBtn">Authorize Access</button>
      </div>
    </div>
  </div>
  
  <script src="scripts/data-viewer.js"></script>
</body>
</html>
